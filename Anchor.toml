[toolchain]
anchor_version = "0.32.2"

[features]
resolution = true
skip-lint = false

[programs.devnet]
liquidity_shield_solana = "7mgbZq9YseuJpMhnRAthiz6t8i2iLVFgwG9gjkvhHRoH"

[programs.localnet]
liquidity_shield_solana = "7mgbZq9YseuJpMhnRAthiz6t8i2iLVFgwG9gjkvhHRoH"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 --require ts-node/register tests/**/*.ts"

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false
